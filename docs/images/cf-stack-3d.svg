<text x="1230" y="635" class="t">ANTI-CORRUPTION LAYER</text>
<text x="60" y="760" class="t">KEY</text><text x="60" y="786" fill="#1f4fe0" font-size="12.5" font-weight="700">1</text><text x="82" y="786" class="s">The edge screens each request.</text><text x="60" y="808" fill="#1f4fe0" font-size="12.5" font-weight="700">2</text><text x="82" y="808" class="s">Turnstile checks the bot token.</text><text x="60" y="830" fill="#1f4fe0" font-size="12.5" font-weight="700">3</text><text x="82" y="830" class="s">Assets serve the SPA. Hono serves /api.</text><text x="60" y="852" fill="#1f4fe0" font-size="12.5" font-weight="700">4</text><text x="82" y="852" class="s">Use cases read and write D1.</text><text x="60" y="874" fill="#1f4fe0" font-size="12.5" font-weight="700">5</text><text x="82" y="874" class="s">KV keeps the token blacklist, a throttle and webhook dedup keys.</text><text x="60" y="896" fill="#1f4fe0" font-size="12.5" font-weight="700">6</text><text x="82" y="896" class="s">Domain events write PDF files to R2.</text><text x="60" y="918" fill="#1f4fe0" font-size="12.5" font-weight="700">7</text><text x="82" y="918" class="s">Adapters call providers. Providers send webhooks to Hono.</text>
