<text x="60" y="800" class="t">KEY</text><text x="60" y="826" fill="#1f4fe0" font-size="12.5" font-weight="700">1</text><text x="82" y="826" class="s">Identity and Borrower answer the ApplicantGateway port.</text><text x="60" y="848" fill="#1f4fe0" font-size="12.5" font-weight="700">2</text><text x="82" y="848" class="s">The Loan aggregate applies the rules and records events.</text><text x="60" y="870" fill="#1f4fe0" font-size="12.5" font-weight="700">3</text><text x="82" y="870" class="s">Payments gets quotes from Lending. Lending applies each payment.</text><text x="60" y="892" fill="#1f4fe0" font-size="12.5" font-weight="700">4</text><text x="82" y="892" class="s">Lending publishes its events after the save.</text><text x="60" y="914" fill="#1f4fe0" font-size="12.5" font-weight="700">5</text><text x="82" y="914" class="s">Documents makes a PDF for each event it receives.</text><text x="60" y="936" fill="#1f4fe0" font-size="12.5" font-weight="700">6</text><text x="82" y="936" class="s">Communication sends notifications and emails.</text><text x="60" y="958" fill="#1f4fe0" font-size="12.5" font-weight="700">7</text><text x="82" y="958" class="s">Reporting reads the loan and payment tables directly.</text>
