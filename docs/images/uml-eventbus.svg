<polygon points="722.6,291.6 702.4,420.7 702.4,402.0 722.6,272.9" class="ink" style="fill:#e5e7e6"/><polygon points="462.9,397.6 702.4,420.7 702.4,402.0 462.9,378.8" class="ink" style="fill:#f3f4f4"/><polygon points="483.1,249.7 722.6,272.9 702.4,402.0 462.9,378.8" class="ink" style="fill:#fff"/><g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><g transform="translate(245,30)"><svg x="14" y="12" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#14271f" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" />
