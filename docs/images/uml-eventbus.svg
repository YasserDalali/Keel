</svg><text x="14" y="64" class="h" style="fill:#1f7a4d;font-size:16px">EVENTBUS</text><text x="14" y="84" class="s" style="font-size:14px">In memory, in the Worker</text><text x="14" y="112" class="s" style="fill:#14271f;font-size:13px">subscribe(type, handler)</text><text x="14" y="131" class="s" style="fill:#14271f;font-size:13px">publish(events)</text><text x="14" y="150" class="s" style="fill:#14271f;font-size:13px"></text><text x="14" y="169" class="s" style="fill:#14271f;font-size:13px">Map&lt;type, handler[]&gt;</text><text x="14" y="188" class="s" style="fill:#14271f;font-size:13px">each handler in try/catch</text></g></g>
<polygon points="1449.7,346.8 1436.5,431.3 1436.5,412.5 1449.7,328.1" class="ink" style="fill:#e5e7e6"/><polygon points="1184.4,406.9 1436.5,431.3 1436.5,412.5 1184.4,388.1" class="ink" style="fill:#f3f4f4"/><polygon points="1197.6,303.7 1449.7,328.1 1436.5,412.5 1184.4,388.1" class="ink" style="fill:#fff"/><g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><g transform="translate(810,15)"><svg x="12" y="11" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14271f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
  <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
</svg><text x="42" y="29" class="h" style="font-size:14px">PAYMENTS</text><text x="12" y="54" class="s" style="font-size:13px">writes the disbursement</text></g></g>
<polygon points="1433.4,451.1 1420.3,535.6 1420.3,516.8 1433.4,432.4" class="ink" style="fill:#e5e7e6"/><polygon points="1168.2,511.2 1420.3,535.6 1420.3,516.8 1168.2,492.4" class="ink" style="fill:#f3f4f4"/><polygon points="1181.3,408.0 1433.4,432.4 1420.3,516.8 1168.2,492.4" class="ink" style="fill:#fff"/><g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><g transform="translate(810,120)"><svg x="12" y="11" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14271f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
  <rect x="2" y="4" width="20" height="16" rx="2" />
</svg><text x="42" y="29" class="h" style="font-size:13px">COMMUNICATION</text><text x="12" y="54" class="s" style="font-size:13px">notifies, sends the email</text></g></g>
<polygon points="696.2,460.5 680.8,559.8 680.8,541.0 696.2,441.7" class="ink" style="fill:#e5e7e6"/><polygon points="441.3,536.6 680.8,559.8 680.8,541.0 441.3,517.9" class="ink" style="fill:#f3f4f4"/><polygon points="456.7,418.5 696.2,441.7 680.8,541.0 441.3,517.9" class="ink" style="fill:#fff"/><g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><g transform="translate(245,200)"><svg x="14" y="12" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#14271f" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" />
</svg><text x="14" y="64" class="h" style="font-size:16px">D1</text><text x="14" y="84" class="s" style="font-size:14px">One batch for the loan</text></g></g>
<polygon points="1417.2,555.4 1404.0,639.9 1404.0,621.1 1417.2,536.7" class="ink" style="fill:#e5e7e6"/><polygon points="1151.9,615.5 1404.0,639.9 1404.0,621.1 1151.9,596.7" class="ink" style="fill:#f3f4f4"/><polygon points="1165.1,512.3 1417.2,536.7 1404.0,621.1 1151.9,596.7" class="ink" style="fill:#fff"/><g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><g transform="translate(810,225)"><svg x="12" y="11" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14271f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M10 9H8" />
  <path d="M16 13H8" />
  <path d="M16 17H8" />
</svg><text x="42" y="29" class="h" style="font-size:14px">DOCUMENTS</text><text x="12" y="54" class="s" style="font-size:13px">renders the loan PDF</text></g></g>
<g transform="matrix(1.2605,0.12196,-0.15477,0.99331,178.86,190.00)"><path d="M190 95 H243" class="ink" style="" marker-end="url(#ae)"/><path d="M340 160 V198" class="ink" style="" marker-end="url(#ae)"/><path d="M435 95 H508" class="ink" style="" marker-end="url(#ae)"/><path d="M740 57 H808" class="ink" style="stroke-dasharray:6 4;stroke:#1f7a4d" marker-end="url(#ae)"/><path d="M740 162 H808" class="ink" style="stroke-dasharray:6 4;stroke:#1f7a4d" marker-end="url(#ae)"/><path d="M740 267 H808" class="ink" style="stroke-dasharray:6 4;stroke:#1f7a4d" marker-end="url(#ae)"/><circle cx="217" cy="95" r="9" class="acc" style="fill:#fff"/><text x="217" y="98.5" class="n" style="font-size:10.5px">1</text><circle cx="340" cy="179" r="9" class="acc" style="fill:#fff"/><text x="340" y="182.5" class="n" style="font-size:10.5px">2</text><circle cx="472" cy="95" r="9" class="acc" style="fill:#fff"/><text x="472" y="98.5" class="n" style="font-size:10.5px">3</text><circle cx="774" cy="57" r="9" class="acc" style="fill:#fff"/><text x="774" y="60.5" class="n" style="font-size:10.5px">4</text><circle cx="774" cy="162" r="9" class="acc" style="fill:#fff"/><text x="774" y="165.5" class="n" style="font-size:10.5px">5</text><circle cx="774" cy="267" r="9" class="acc" style="fill:#fff"/><text x="774" y="270.5" class="n" style="font-size:10.5px">6</text></g>
<text x="60" y="700" class="t">KEY</text><text x="60" y="726" fill="#1f7a4d" font-size="12.5" font-weight="700">1</text><text x="82" y="726" class="s">The Loan records loan-approved. The use case pulls the event with pullEvents().</text><text x="60" y="748" fill="#1f7a4d" font-size="12.5" font-weight="700">2</text><text x="82" y="748" class="s">The use case saves the Loan to D1, in one batch.</text><text x="60" y="770" fill="#1f7a4d" font-size="12.5" font-weight="700">3</text><text x="82" y="770" class="s">After the save, the use case publishes the event to the bus.</text><text x="60" y="792" fill="#1f7a4d" font-size="12.5" font-weight="700">4</text><text x="82" y="792" class="s">The bus calls the Payments handler, which writes the disbursement entry.</text><text x="60" y="814" fill="#1f7a4d" font-size="12.5" font-weight="700">5</text><text x="82" y="814" class="s">The bus calls the Communication handler, which notifies the borrower and sends the email.</text><text x="60" y="836" fill="#1f7a4d" font-size="12.5" font-weight="700">6</text><text x="82" y="836" class="s">The bus calls the Documents handler, which renders the loan agreement PDF into R2.</text>
<path d="M960 716 H1468 L1480 728 V786 H960 Z" style="fill:#f7f6f2;stroke:#1f7a4d;stroke-width:1.2"/><path d="M1468 716 V728 H1480" style="fill:none;stroke:#1f7a4d;stroke-width:1.2"/><text x="972" y="738" class="s" text-anchor="start" style="font-size:12px;fill:#14271f">A handler that throws is logged. The loan stays approved.</text><text x="972" y="756" class="s" text-anchor="start" style="font-size:12px;fill:#14271f">Each handler subscribes once at startup, in app/wiring/.</text><text x="972" y="774" class="s" text-anchor="start" style="font-size:12px;fill:#14271f">Nothing is stored between the steps.</text>
<text x="60" y="880" class="t" text-anchor="start" style="">HOW IT COMPARES WITH A BROKER</text>
<rect x="300" y="896" width="310" height="250" style="fill:#edf7f1;stroke:#1f7a4d;stroke-width:2"/>
<rect x="610" y="896" width="310" height="250" style="fill:none;stroke:#1f7a4d;stroke-width:1.5;stroke-dasharray:6 4"/>
<rect x="60" y="896" width="1480" height="250" style="fill:none;stroke:#14271f;stroke-width:1.5"/>
<line x1="60" y1="942" x2="1540" y2="942" style="stroke:#14271f;stroke-width:1.5"/>
<text x="314" y="916" class="h" text-anchor="start" style="font-size:13.5px;fill:#1f7a4d">In-process bus</text>
<text x="314" y="933" class="s" text-anchor="start" style="font-size:11px">Keel today</text>
<text x="624" y="916" class="h" text-anchor="start" style="font-size:13.5px;">Cloudflare Queues</text>
<text x="624" y="933" class="s" text-anchor="start" style="font-size:11px">the upgrade path</text>
<text x="934" y="916" class="h" text-anchor="start" style="font-size:13.5px;">RabbitMQ</text>
<text x="934" y="933" class="s" text-anchor="start" style="font-size:11px">a message broker</text>
<text x="1244" y="916" class="h" text-anchor="start" style="font-size:13.5px;">Kafka</text>
<text x="1244" y="933" class="s" text-anchor="start" style="font-size:11px">an event log</text>
<text x="74" y="964" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Where it runs</text>
<text x="314" y="964" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Inside the Worker</text>
<text x="624" y="964" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Managed by Cloudflare</text>
<text x="934" y="964" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">A broker you run or rent</text>
<text x="1244" y="964" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">A broker cluster</text>
<line x1="60" y1="976" x2="1540" y2="976" style="stroke:#d9dcdb;stroke-width:1"/>
<text x="74" y="998" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Needs an always-on server</text>
<text x="314" y="998" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<text x="624" y="998" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<text x="934" y="998" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="1244" y="998" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<line x1="60" y1="1010" x2="1540" y2="1010" style="stroke:#d9dcdb;stroke-width:1"/>
<text x="74" y="1032" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Keeps messages if the Worker stops</text>
<text x="314" y="1032" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<text x="624" y="1032" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="934" y="1032" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="1244" y="1032" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<line x1="60" y1="1044" x2="1540" y2="1044" style="stroke:#d9dcdb;stroke-width:1"/>
<text x="74" y="1066" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Retries a failed handler</text>
<text x="314" y="1066" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<text x="624" y="1066" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="934" y="1066" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="1244" y="1066" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes, by replay</text>
<line x1="60" y1="1078" x2="1540" y2="1078" style="stroke:#d9dcdb;stroke-width:1"/>
<text x="74" y="1100" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Fits one Worker deploy</text>
<text x="314" y="1100" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="624" y="1100" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Yes</text>
<text x="934" y="1100" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<text x="1244" y="1100" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">No</text>
<line x1="60" y1="1112" x2="1540" y2="1112" style="stroke:#d9dcdb;stroke-width:1"/>
<text x="74" y="1134" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Cost shape</text>
<text x="314" y="1134" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">None extra</text>
<text x="624" y="1134" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Per message</text>
<text x="934" y="1134" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Fixed monthly, plus upkeep</text>
<text x="1244" y="1134" class="s" text-anchor="start" style="font-size:12.5px;fill:#14271f">Fixed monthly, plus upkeep</text>
<text x="60" y="1174" class="s" text-anchor="start" style="font-size:13px;fill:#14271f">Keel starts with the simplest bus that works. The contexts only know publish and subscribe,</text>
<text x="60" y="1194" class="s" text-anchor="start" style="font-size:13px;fill:#14271f">so Cloudflare Queues can replace it later without a change to Lending, Payments or Documents.</text>
