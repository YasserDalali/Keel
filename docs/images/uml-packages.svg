<marker id="many" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M15 1L3 8L15 15M3 8H15M1 2V14" fill="none" stroke="#14213d" stroke-width="1.3"/></marker>
</defs>
<text x="60" y="190" class="t" text-anchor="start" style="">INSIDE EVERY CONTEXT</text>
<rect x="60" y="210" width="700" height="520" rx="22" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/>
<line x1="410" y1="210" x2="410" y2="308" class="dash"/><line x1="410" y1="652" x2="410" y2="730" class="dash"/>
<text x="80" y="240" class="t" text-anchor="start" style="font-size:12px">INTERFACE</text><text x="80" y="258" class="s" text-anchor="start" style="font-size:11.5px">Hono routes. Parse, authorise,</text><text x="80" y="274" class="s" text-anchor="start" style="font-size:11.5px">call one use case, map errors.</text>
<text x="740" y="240" class="t" text-anchor="end" style="font-size:12px">INFRASTRUCTURE</text><text x="740" y="258" class="s" text-anchor="end" style="font-size:11.5px">D1, R2 and provider adapters.</text><text x="740" y="274" class="s" text-anchor="end" style="font-size:11.5px">Provider data stays here.</text>
<rect x="150" y="310" width="520" height="340" rx="18" style="fill:#fff;stroke:#14213d;stroke-width:1.5;"/>
<text x="410.0" y="336" class="t" text-anchor="middle" style="font-size:12px;">APPLICATION</text>
<text x="410.0" y="354" class="s" text-anchor="middle" style="font-size:11.5px">Use cases and the ports they need</text>
<rect x="260" y="400" width="300" height="200" rx="18" style="fill:#f1f5ff;stroke:#1f4fe0;stroke-width:2;"/>
<text x="410.0" y="426" class="t" text-anchor="middle" style="font-size:12px;fill:#1f4fe0">DOMAIN</text>
<text x="410.0" y="444" class="s" text-anchor="middle" style="font-size:11.5px">Pure TypeScript</text>
<text x="410" y="470" class="s" text-anchor="middle" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#14213d">aggregates, entities</text>
<text x="410" y="490" class="s" text-anchor="middle" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#14213d">value objects, rules</text>
<text x="410" y="510" class="s" text-anchor="middle" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#14213d">domain events</text>
<text x="410" y="530" class="s" text-anchor="middle" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#14213d">repository interfaces</text>
<path d="M110 470 H148" class="ink" style="" marker-end="url(#ae)"/><path d="M710 470 H672" class="ink" style="" marker-end="url(#ae)"/>
<path d="M200 500 H258" class="ink" style="" marker-end="url(#ae)"/><path d="M620 500 H562" class="ink" style="" marker-end="url(#ae)"/>
<text x="410" y="770" class="s" text-anchor="middle" style="font-size:12.5px;fill:#14213d">Every arrow points inward. The domain depends on nothing outside.</text>
<text x="840" y="190" class="t" text-anchor="start" style="">THE PACKAGES IN api/src</text>
<path d="M840 210 H936 V232 H1540 V480 H840 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="840" y1="232" x2="936" y2="232" style="stroke:#14213d;stroke-width:1"/>
<text x="850" y="226" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px;">contexts/</text>
<text x="852" y="256" class="s" text-anchor="start" style="font-size:12px">One package per bounded context. Each has the same four layers.</text>
<path d="M860 280 H948 V302 H1016 V350 H860 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="860" y1="302" x2="948" y2="302" style="stroke:#14213d;stroke-width:1"/>
<text x="870" y="296" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">identity</text>
<text x="872" y="326" class="s" text-anchor="start" style="font-size:12px">accounts, email checks</text>
<path d="M1028 280 H1116 V302 H1184 V350 H1028 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1028" y1="302" x2="1116" y2="302" style="stroke:#14213d;stroke-width:1"/>
<text x="1038" y="296" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">borrower</text>
<text x="1040" y="326" class="s" text-anchor="start" style="font-size:12px">profile, KYC, bank</text>
<path d="M1196 280 H1276 V302 H1352 V350 H1196 Z" style="fill:#f1f5ff;stroke:#1f4fe0;stroke-width:2"/><line x1="1196" y1="302" x2="1276" y2="302" style="stroke:#1f4fe0;stroke-width:1"/>
<text x="1206" y="296" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;fill:#1f4fe0">lending</text>
<text x="1208" y="326" class="s" text-anchor="start" style="font-size:12px">the Loan: core domain</text>
<path d="M1364 280 H1452 V302 H1520 V350 H1364 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1364" y1="302" x2="1452" y2="302" style="stroke:#14213d;stroke-width:1"/>
<text x="1374" y="296" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">payments</text>
<text x="1376" y="326" class="s" text-anchor="start" style="font-size:12px">money in, the ledger</text>
<path d="M860 375 H956 V397 H1016 V445 H860 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="860" y1="397" x2="956" y2="397" style="stroke:#14213d;stroke-width:1"/>
<text x="870" y="391" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">documents</text>
<text x="872" y="421" class="s" text-anchor="start" style="font-size:12px">PDFs in R2</text>
<path d="M1028 375 H1156 V397 H1184 V445 H1028 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1028" y1="397" x2="1156" y2="397" style="stroke:#14213d;stroke-width:1"/>
<text x="1038" y="391" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">communication</text>
<text x="1040" y="421" class="s" text-anchor="start" style="font-size:12px">alerts and email</text>
<path d="M1196 375 H1292 V397 H1352 V445 H1196 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1196" y1="397" x2="1292" y2="397" style="stroke:#14213d;stroke-width:1"/>
<text x="1206" y="391" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:12.5px;">reporting</text>
<text x="1208" y="421" class="s" text-anchor="start" style="font-size:12px">read models</text>
<path d="M840 520 H920 V542 H1180 V640 H840 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="840" y1="542" x2="920" y2="542" style="stroke:#14213d;stroke-width:1"/>
<text x="850" y="536" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px;">shared/</text>
<text x="852" y="566" class="s" text-anchor="start" style="font-size:12px">The shared kernel, deliberately tiny:</text>
<text x="852" y="584" class="s" text-anchor="start" style="font-size:12px">Money, Clock, IdGenerator, DomainError,</text>
<text x="852" y="602" class="s" text-anchor="start" style="font-size:12px">EventBus, crypto, the overdue rule</text>
<path d="M1200 520 H1270 V542 H1540 V640 H1200 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1200" y1="542" x2="1270" y2="542" style="stroke:#14213d;stroke-width:1"/>
<text x="1210" y="536" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px;">app/</text>
<text x="1212" y="566" class="s" text-anchor="start" style="font-size:12px">The composition root: container.ts and</text>
<text x="1212" y="584" class="s" text-anchor="start" style="font-size:12px">wiring/&lt;context&gt;.ts build every class.</text>
<text x="1212" y="602" class="s" text-anchor="start" style="font-size:12px">http.ts maps each domain error to a status.</text>
<path d="M840 670 H952 V692 H1180 V750 H840 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="840" y1="692" x2="952" y2="692" style="stroke:#14213d;stroke-width:1"/>
<text x="850" y="686" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px;">middleware/</text>
<text x="852" y="716" class="s" text-anchor="start" style="font-size:12px">requireAuth, requireRole, turnstile</text>
<path d="M1200 670 H1288 V692 H1540 V750 H1200 Z" style="fill:#fff;stroke:#14213d;stroke-width:1.5"/><line x1="1200" y1="692" x2="1288" y2="692" style="stroke:#14213d;stroke-width:1"/>
<text x="1210" y="686" class="h" text-anchor="start" style="font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px;">index.ts</text>
<text x="1212" y="716" class="s" text-anchor="start" style="font-size:12px">Mounts the routers. Exports the Worker</text>
<text x="1212" y="734" class="s" text-anchor="start" style="font-size:12px">and the daily cron.</text>
<path d="M1370 520 V482" class="ink" style="stroke-dasharray:6 4;" marker-end="url(#open)"/><text x="1380" y="505" class="s" text-anchor="start" style="font-size:11px">builds</text>
<path d="M1010 482 V518" class="ink" style="stroke-dasharray:6 4;" marker-end="url(#open)"/><text x="1020" y="505" class="s" text-anchor="start" style="font-size:11px">uses</text>
<path d="M1370 670 V642" class="ink" style="stroke-dasharray:6 4;" marker-end="url(#open)"/><text x="1380" y="660" class="s" text-anchor="start" style="font-size:11px">uses</text>
<line x1="60" y1="810" x2="1540" y2="810" class="thin" style="stroke:#d3dcea"/>
<text x="60" y="840" class="t" text-anchor="start" style="">GUARDED BY api/test/architecture.spec.ts</text>
<svg x="60" y="858" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="870" class="s" text-anchor="start" style="">Domain code depends only on the shared kernel and its own domain.</text>
<svg x="60" y="882" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="894" class="s" text-anchor="start" style="">Domain code never touches the platform: no Hono, no D1, no fetch.</text>
<svg x="60" y="906" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="918" class="s" text-anchor="start" style="">Application code does not depend on infrastructure or the web layer.</text>
<svg x="760" y="858" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="782" y="870" class="s" text-anchor="start" style="">A context never reaches into the infrastructure or interface of another context.</text>
<svg x="760" y="882" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="782" y="894" class="s" text-anchor="start" style="">Interface code calls use cases. It contains no repositories and no SQL.</text>
<rect x="1380" y="940" width="160" height="70" class="ink"/><line x1="1380" y1="975" x2="1540" y2="975" class="thin"/><line x1="1460" y1="975" x2="1460" y2="1010" class="thin"/><text x="1392" y="962" class="t">UML-06 STRUCTURE</text><text x="1392" y="998" class="s">UML</text><text x="1472" y="998" class="s">REV A</text></svg>