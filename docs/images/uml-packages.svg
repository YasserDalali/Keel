<text x="60" y="108" fill="#14213d" font-size="36" font-weight="600">How the code is organised</text>
<line x1="60" y1="132" x2="1540" y2="132" class="thin"/>
<defs>
<marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1L13 7L1 13z" fill="#fff" stroke="#14213d" stroke-width="1.3"/></marker>
<marker id="dia" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M1 5L9 1L17 5L9 9z" fill="#14213d"/></marker>
