<text x="60" y="835" class="t">KEY</text>
<text x="60" y="862" fill="#1f4fe0" font-size="12.5" font-weight="700">1</text><text x="82" y="862" class="s">The edge screens each request.</text>
<text x="60" y="886" fill="#1f4fe0" font-size="12.5" font-weight="700">2</text><text x="82" y="886" class="s">Turnstile checks the bot token.</text>
<text x="60" y="910" fill="#1f4fe0" font-size="12.5" font-weight="700">3</text><text x="82" y="910" class="s">Assets serve the SPA. Hono serves /api.</text>
<text x="60" y="934" fill="#1f4fe0" font-size="12.5" font-weight="700">4</text><text x="82" y="934" class="s">Use cases read and write D1.</text>
<text x="530" y="862" fill="#1f4fe0" font-size="12.5" font-weight="700">5</text><text x="552" y="862" class="s">KV keeps the token blacklist, a throttle and webhook dedup keys.</text>
<text x="530" y="886" fill="#1f4fe0" font-size="12.5" font-weight="700">6</text><text x="552" y="886" class="s">Domain events write PDF files to R2.</text>
<text x="530" y="910" fill="#1f4fe0" font-size="12.5" font-weight="700">7</text><text x="552" y="910" class="s">Adapters call providers. Providers send webhooks to Hono.</text>
