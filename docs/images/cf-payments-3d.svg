<text x="60" y="320" class="t">SAFETY CHECKS</text>
<svg x="60" y="334" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="346" class="s">Payments asks Lending for the amount. The client never</text>
<text x="82" y="365" class="s">sets it.</text>
<svg x="60" y="379" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="391" class="s">The provider must report the money as collected.</text>
<svg x="60" y="405" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="417" class="s">The payment must match the loan, the user and the</text>
<text x="82" y="436" class="s">installment.</text>
<svg x="60" y="450" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="462" class="s">The amount recorded is the amount the provider</text>
<text x="82" y="481" class="s">collected.</text>
<svg x="60" y="495" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="507" class="s">The ledger records each provider reference once. A</text>
<text x="82" y="526" class="s">repeat returns the first result.</text>
<svg x="60" y="540" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f4fe0" stroke-width="3.771" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" />
</svg><text x="82" y="552" class="s">A PayPal capture runs once. A repeat is answered from</text>
<text x="82" y="571" class="s">the ledger.</text>
<text x="60" y="613" class="t">KEY</text><text x="60" y="639" fill="#1f4fe0" font-size="12.5" font-weight="700">1</text><text x="82" y="639" class="s">Create asks Lending for the amount due.</text><text x="60" y="661" fill="#1f4fe0" font-size="12.5" font-weight="700">2</text><text x="82" y="661" class="s">The gateway opens a PayPal order. Confirm captures it.</text><text x="60" y="683" fill="#1f4fe0" font-size="12.5" font-weight="700">3</text><text x="82" y="683" class="s">verifySettlement checks the money arrived for this target.</text><text x="60" y="705" fill="#1f4fe0" font-size="12.5" font-weight="700">4</text><text x="82" y="705" class="s">Confirm sends an installment payment to RecordRepayment.</text><text x="60" y="727" fill="#1f4fe0" font-size="12.5" font-weight="700">5</text><text x="82" y="727" class="s">The ledger records the payment once per provider reference.</text><text x="60" y="749" fill="#1f4fe0" font-size="12.5" font-weight="700">6</text><text x="82" y="749" class="s">Lending applies the payment. A deposit goes to Lending directly.</text><text x="60" y="771" fill="#1f4fe0" font-size="12.5" font-weight="700">7</text><text x="82" y="771" class="s">On loan-approved, the ledger records the disbursement.</text>
